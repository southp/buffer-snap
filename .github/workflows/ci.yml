name: CI

# Lint and every test (Core + app + snapshots) on each PR and each push to main,
# through the same `just` recipes developers run locally. A change to safe files only
# (docs and site/, see the "Choose the path" step) skips both, on PRs and on main.
# Once `ci` passes on main, the `deploy` job uploads the commit to TestFlight.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A newer push to a PR supersedes its run in progress. Runs on main never cancel each other, so
  # merges are tested and deployed one after the other, in order (docs/decisions/9-deploy-on-merge.md).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether the change needs the macOS runner at all (docs/decisions/102-docs-only-skips-ci.md).
  # Cheap on Linux, so a docs-only change never waits for an `xcode-27` runner.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.path.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a PR, HEAD is GitHub's merge commit and its first parent is the base branch,
          # so two commits of history are enough to list the files the PR changes.
          fetch-depth: 2

      - name: Choose the path
        id: path
        # Skip `ci` (and so `deploy`) only when every changed file is on this allowlist: docs, the PR template,
        # the Claude workflows and the public site. Anything else, ci.yml and justfile included, takes the full path.
        # A PR diffs its merge commit against the base; a push to main diffs against the commit main was at before.
        # In a `case`, `*` also matches `/`, so `*.md`, `docs/*` and `site/*` match at any depth. That's on purpose,
        # to cover each area's CLAUDE.md, and safe because target specs exclude Markdown from bundles and nothing
        # but pages.yml reads site/. Don't make a Markdown or site/ file an input to the build without narrowing
        # these patterns.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          full=true
          base=""
          if [[ "$EVENT" == "pull_request" ]]; then
            if git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
              base='HEAD^1'
            else
              echo "Full path: HEAD isn't a PR merge commit, so the changed files are unknown"
            fi
          elif [[ "$EVENT" == "push" ]]; then
            # Fetch only that one commit: `fetch-depth: 0` would also download the pr-media binaries.
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              echo "Full path: the push has no previous commit to compare with"
            elif ! git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
              echo "Full path: couldn't fetch the previous commit $BEFORE"
            else
              base="$BEFORE"
            fi
          else
            echo "Full path: '$EVENT' event"
          fi
          if [[ -n "$base" ]]; then
            # --no-renames lists a moved file under both names, so moving code into docs/ isn't safe.
            if ! changed="$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD)"; then
              echo "Full path: couldn't list the changed files"
            elif [[ -z "$changed" ]]; then
              echo "Full path: the change touches no files"
            else
              full=false
              echo "Changed files:"
              while IFS= read -r file; do
                case "$file" in
                  *.md | docs/* | site/* | LICENSE | .github/workflows/claude.yml | .github/workflows/claude-code-review.yml)
                    echo "  safe  $file"
                    ;;
                  *)
                    echo "  full  $file"
                    full=true
                    ;;
                esac
              done <<<"$changed"
              if [[ "$full" == "true" ]]; then
                echo "Full path: a changed file isn't on the safe list"
              else
                echo "Skip: every changed file is on the safe list, so ci and deploy don't run"
              fi
            fi
          fi
          echo "full=$full" >>"$GITHUB_OUTPUT"

  # Branch protection requires this job by name (`ci`). Rename it only together with the rule.
  # When `changes` skips it, GitHub reports the skipped job as passed, which satisfies the rule.
  ci:
    needs: changes
    # Run unless `changes` explicitly found a docs-only change: if `changes` itself fails, its output is empty
    # and the full path runs, rather than a skipped `ci` passing the rule untested.
    if: ${{ !cancelled() && needs.changes.outputs.full != 'false' }}
    # The only hosted image with Xcode 27.2; `macos-15`/`macos-26` stop at Xcode 26.
    # See docs/decisions/6-xcode-27-runner.md.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 27.2
        # The Xcode developers use locally; SIM_OS in the justfile is its iOS runtime. The image's
        # default Xcode is older. Bump this path together with SIM_OS.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Install just
        run: brew install just

      - name: Install the pinned iOS simulator runtime
        # The image lacks an iOS SIM_OS runtime that runs SIM_DEVICE, so download the same build
        # developers have locally (`xcrun simctl runtime list`) rather than change the pins. Asking
        # for "27.2" instead gets a device-specific runtime (iOS-27-2-iPhone19-4) without iPhone 16.
        # Skipped once the image ships a runtime that works.
        run: |
          if just _sim-udid >/dev/null 2>&1; then
            echo "The image already has a runtime for the pinned simulator"
          else
            build="$(just --evaluate SIM_RUNTIME_BUILD)"
            xcodebuild -downloadPlatform iOS -buildVersion "$build"
          fi
          xcrun simctl runtime list

      - name: Bootstrap
        run: just bootstrap

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Upload test artifacts
        # Snapshot failures land in build/snapshot-failures/ (the actual PNG next to the path of the
        # reference); the .xcresult has the full test log and attachments.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            build/snapshot-failures/**
            build/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Only pushes to main run this job, so PRs, forks included, never reach the secrets below.
  # It's skipped whenever `ci` is, so a docs-only merge ships no TestFlight build.
  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 27.2
        # Same Xcode as the `ci` job. Bump this path together with SIM_OS.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version

      - name: Install just
        run: brew install just

      - name: Install tools
        # Not `just bootstrap`: an archive needs no simulator, so this skips creating one.
        run: just _bootstrap-tools

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8" >"$key_path")
          echo "ASC_KEY_PATH=$key_path" >>"$GITHUB_ENV"

      - name: Deploy
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: just deploy
