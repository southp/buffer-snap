name: Claude Code Review

# Reviews every non-draft PR when it opens, leaves draft, or gets new commits.
# Runs bill the owner's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), and the
# action refuses to run for PR authors without write access to the repo.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  # A newer push supersedes a review that's still running.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts (ready_for_review reviews them later) and fork PRs, which
    # can't read the OAuth secret anyway.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Review this pull request. The PR branch is checked out in the current directory.

            1. Read `CLAUDE.md` and every doc it links (e.g. `docs/decisions/`). Treat its
               rules as the review standard: workflow, commit format, lint policy, layout.
               Flag violations and cite the rule.
            2. Find the issue this PR closes: run
               `gh pr view ${{ github.event.pull_request.number }} --json body,closingIssuesReferences`,
               then `gh issue view <N>` for each closed issue. Check the diff against that
               issue's tasks and acceptance criteria. Say which criteria are met, which are
               not, and which can only be checked manually. If the PR closes no issue, flag it.
            3. Look for bugs, Swift 6 concurrency problems, and missing tests for new behaviour.

            This runner is Linux without Xcode, so don't try `just`, `xcodebuild` or `swift`.
            Judge from the code.

            If EVENT is `synchronize`, this is a follow-up review: read the existing comments
            (`gh pr view ${{ github.event.pull_request.number }} --comments`), review only what
            changed since, and don't repeat findings that are already posted.

            Output:
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
              for findings tied to specific lines.
            - Post one top-level summary with `gh pr comment`: a one-line verdict first, then
              an acceptance-criteria checklist, then the findings ranked by severity.
            - Only post GitHub comments; don't reply with the review as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
