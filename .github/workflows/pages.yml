name: Pages

# Publishes site/ to https://southp.github.io/buffer-snap/ when it changes on main. Only that folder goes public.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
