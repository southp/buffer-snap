name: Report a problem
description: Something in BufSnap doesn't work as you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. No GitHub account? Email us instead, from the [support page](https://southp.github.io/buffer-snap/support/#report).
  - type: input
    id: app-version
    attributes:
      label: BufSnap version
      description: Tap the person icon at the top right of BufSnap. It's at the bottom of the menu.
      placeholder: BufSnap 1.1 (42)
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      description: Settings → General → About → iOS Version.
      placeholder: "18.6"
    validations:
      required: true
  - type: input
    id: iphone-model
    attributes:
      label: iPhone model
      description: Settings → General → About → Model Name.
      placeholder: iPhone 16 Pro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: My idea would show up in Buffer a few minutes after I dictated it.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Screenshots or a screen recording help a lot. Drag them in here.
      placeholder: The batch says "Not sent", and Resend doesn't change that.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, one step per line, so we can try it ourselves.
      placeholder: |
        1. Press Dictate an Idea from the Action button.
        2. Say an idea and press again.
        3. Open BufSnap.
    validations:
      required: false
