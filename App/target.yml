# XcodeGen spec for the BufferSnap app target, included from the root project.yml.
# Paths are relative to the repo root.
packages:
  BufferSnapCore:
    path: Packages/BufferSnapCore

targets:
  BufferSnap:
    type: application
    platform: iOS
    sources:
      # Copies App/PrivacyInfo.xcprivacy, the privacy manifest, into the bundle as a resource
      # (docs/decisions/47-privacy-manifest.md).
      - path: App
        # Keep this spec and the area's CLAUDE.md out of the app bundle.
        excludes:
          - "target.yml"
          - "**/*.md"
      # Intents and the Live Activity's attributes, compiled into both targets: `openAppWhenRun` needs that, and the
      # widget draws the Live Activity that the app starts.
      - path: Shared
    dependencies:
      - package: BufferSnapCore
      - target: BufferSnapWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.southp.buffersnap
        # Not XcodeGen's `entitlements:` key: without `properties` it overwrites this file with an empty one.
        CODE_SIGN_ENTITLEMENTS: App/BufferSnap.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Holds only the `buffersnap` URL scheme and UIBackgroundModes (audio, to keep listening with the app closed,
        # and fetch for background refresh) with its task identifiers, which have no INFOPLIST_KEY_ settings; the rest
        # is generated.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BufferSnap
        # Skips the export-compliance prompt on every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "BufferSnap listens while you hold the mic, to turn what you say into a capture. It doesn't keep the audio."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "BufferSnap uses speech recognition to turn what you say into text. Apple may process the audio, and BufferSnap doesn't keep it."
        # The Live Activity of a dictation started from the control or the widget.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
