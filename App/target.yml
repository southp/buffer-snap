# XcodeGen spec for the BufferSnap app target, included from the root project.yml.
# Paths are relative to the repo root.
packages:
  BufferSnapCore:
    path: Packages/BufferSnapCore

targets:
  BufferSnap:
    type: application
    platform: iOS
    sources:
      - path: App
        # Keep this spec and the area's CLAUDE.md out of the app bundle.
        excludes:
          - "target.yml"
          - "**/*.md"
      # Intents the widget runs but the app must carry too, or `openAppWhenRun` doesn't open it.
      - path: Shared
    dependencies:
      - package: BufferSnapCore
      - target: BufferSnapWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.southp.buffersnap
        # Not XcodeGen's `entitlements:` key: without `properties` it overwrites this file with an empty one.
        CODE_SIGN_ENTITLEMENTS: App/BufferSnap.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Holds only CFBundleURLTypes (the `buffersnap` scheme), which has no INFOPLIST_KEY_ setting; the rest is generated.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BufferSnap
        # Skips the export-compliance prompt on every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
