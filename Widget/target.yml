# XcodeGen spec for the Snapper widget extension, included from the root project.yml and embedded by App/target.yml.
# Paths are relative to the repo root. Team, signing and version settings come from the project level: don't override them here.
targets:
  BufferSnapWidget:
    type: app-extension
    platform: iOS
    sources:
      # Copies Widget/PrivacyInfo.xcprivacy, the extension's own privacy manifest, into its bundle as a resource
      # (docs/decisions/47-privacy-manifest.md).
      - path: Widget
        # Keep this spec and the area's CLAUDE.md out of the extension bundle.
        excludes:
          - "target.yml"
          - "**/*.md"
      # Intents and the Live Activity's attributes, compiled into both targets: the widget's buttons name the intents
      # that the app's process runs, and the widget draws the Live Activity that the app starts. Also the Paper & Ink
      # theme, its color sets and its fonts with their licenses, which each bundle needs its own copy of
      # (docs/decisions/84-paper-and-ink.md).
      - path: Shared
    dependencies:
      - package: BufferSnapCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.southp.buffersnap.widget
        # Not XcodeGen's `entitlements:` key: without `properties` it overwrites this file with an empty one.
        CODE_SIGN_ENTITLEMENTS: Widget/BufferSnapWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # Holds only NSExtension and UIAppFonts, which have no INFOPLIST_KEY_ settings; the rest is generated.
        INFOPLIST_FILE: Widget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: BufSnap
        TARGETED_DEVICE_FAMILY: "1"
