<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Doodle Bulb (#84). Full-bleed square: iOS applies the rounded mask. Regenerate the PNGs with `just app-icon`.
       The drawing is the light icon. The style below recolors it for iOS 18's other appearances, which the recipe
       renders by wrapping this file in an element of that class: `dark`, the same bulb on ink with cream outlines,
       and `tinted`, a grayscale version on black that iOS tints. Viewed on its own, it shows the light icon. -->
  <style>
    .dark rect { fill: #1A1A1A; }
    .dark [stroke="#1A1A1A"] { stroke: #FBF7EE; }
    .tinted rect { fill: #000000; }
    .tinted [fill="#FFE45C"] { fill: #4D4D4D; }
    .tinted [stroke="#1A1A1A"], .tinted [stroke="#FF4D2E"] { stroke: #FFFFFF; }
  </style>
  <rect width="100" height="100" fill="#FBF7EE"/>
  <path d="M50 14 A25 25 0 0 0 35 59 C38 61 40 64 40 68 V73 H60 V68 C60 64 62 61 65 59 A25 25 0 0 0 50 14 Z" fill="#FFE45C" stroke="#1A1A1A" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M36 42 L40 36 L44 48 L48 30 L52 50 L56 34 L60 46 L64 40" fill="none" stroke="#FF4D2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round"><path d="M42 80 H58"/><path d="M45 87 H55"/></g>
  <g fill="none" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"><path d="M21 16 L15 11"/><path d="M79 16 L85 11"/><path d="M14 38 H7"/><path d="M86 38 H93"/></g>
</svg>
