name: BufferSnap

options:
  bundleIdPrefix: me.southp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BufferSnap:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.southp.buffersnap
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BufferSnap
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  BufferSnapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: BufferSnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.southp.buffersnap.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BufferSnap:
    build:
      targets:
        BufferSnap: all
        BufferSnapTests: [test]
    test:
      targets:
        - BufferSnapTests
      gatherCoverageData: false
    run:
      config: Debug
