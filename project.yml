name: BufferSnap

# Each target's spec (sources, settings, dependencies, packages) lives in its own folder, so issues that
# touch different targets edit different files. Paths inside included files are relative to this file.
include:
  - path: App/target.yml
    relativePaths: false
  - path: AppTests/target.yml
    relativePaths: false
  - path: Widget/target.yml
    relativePaths: false

options:
  bundleIdPrefix: me.southp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # The version on the App Store. Raise it before submitting a new version (docs/decisions/47-version-1-0.md).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # From .env (see .env.example). Simulator builds work with it unset, so only `just deploy` requires it.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

schemes:
  BufferSnap:
    build:
      targets:
        BufferSnap: all
        BufferSnapTests: [test]
    test:
      targets:
        - BufferSnapTests
      gatherCoverageData: false
      # A simulator takes its host's language, and text layout follows it, which can move a snapshot's text by 1px.
      commandLineArguments:
        "-AppleLanguages (en-US)": true
        "-AppleLocale en_US": true
        # Nobody answers the system's prompts for the microphone and speech recognition in a test host.
        "-skipPermissionPrompt YES": true
    run:
      config: Debug
