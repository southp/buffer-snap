name: BufferSnap

# Each target's spec (sources, settings, dependencies, packages) lives in its own folder, so issues that
# touch different targets edit different files. Paths inside included files are relative to this file.
include:
  - path: App/target.yml
    relativePaths: false
  - path: AppTests/target.yml
    relativePaths: false
  - path: Widget/target.yml
    relativePaths: false

options:
  bundleIdPrefix: me.southp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  BufferSnap:
    build:
      targets:
        BufferSnap: all
        BufferSnapTests: [test]
    test:
      targets:
        - BufferSnapTests
      gatherCoverageData: false
    run:
      config: Debug
